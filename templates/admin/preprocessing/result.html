{% extends 'layouts/admin.html' %}

{% block content %}

<div class="grid lg:grid-cols-2 gap-6">

    <!-- TRAIN -->
    <div class="bg-white rounded-3xl shadow-lg p-6">

        <h2 class="text-2xl font-bold mb-5 text-blue-600">
            Data Training
        </h2>

        <div class="space-y-3 max-h-[700px] overflow-y-auto">

            {% for item in train_data %}

            <div class="p-4 rounded-2xl bg-gray-50 border">

                <p class="text-gray-700">
                    {{ item[1] }}
                </p>

            </div>

            {% endfor %}

        </div>

    </div>

    <!-- TEST -->
    <div class="bg-white rounded-3xl shadow-lg p-6">

        <h2 class="text-2xl font-bold mb-5 text-emerald-600">
            Data Testing
        </h2>

        <div class="space-y-3 max-h-[700px] overflow-y-auto">

            {% for item in test_data %}

            <div class="p-4 rounded-2xl bg-gray-50 border">

                <p class="text-gray-700">
                    {{ item[1] }}
                </p>

            </div>

            {% endfor %}

        </div>

    </div>

</div>

{% endblock %}
