{% extends 'layouts/admin.html' %}

{% block content %}

<div class="bg-white rounded-3xl shadow-lg p-6">

    <h1 class="text-3xl font-bold text-gray-800 mb-6">
        Confusion Matrix
    </h1>

    <div class="overflow-auto">

        <table class="text-center border-collapse">

            <thead>

                <tr>

                    <th class="border px-8 py-4 bg-gray-100">
                        Actual / Prediction
                    </th>

                    <th class="border px-8 py-4 bg-emerald-100">
                        Positif
                    </th>

                    <th class="border px-8 py-4 bg-red-100">
                        Negatif
                    </th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <th class="border px-8 py-4 bg-emerald-50">
                        Positif
                    </th>

                    <td class="border px-8 py-4 text-2xl font-bold text-emerald-600">
                        {{ tp }}
                    </td>

                    <td class="border px-8 py-4 text-2xl font-bold text-orange-600">
                        {{ fn }}
                    </td>

                </tr>

                <tr>

                    <th class="border px-8 py-4 bg-red-50">
                        Negatif
                    </th>

                    <td class="border px-8 py-4 text-2xl font-bold text-blue-600">
                        {{ fp }}
                    </td>

                    <td class="border px-8 py-4 text-2xl font-bold text-red-600">
                        {{ tn }}
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
