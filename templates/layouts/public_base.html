<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentimen Edlink{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body{
            font-family:'Inter',sans-serif;
        }

        .hero-bg{
            background:
            radial-gradient(circle at top left,#10b981 0%,transparent 35%),
            radial-gradient(circle at bottom right,#06b6d4 0%,transparent 35%),
            #0f172a;
        }

        .glass{
            backdrop-filter: blur(16px);
            background: rgba(255,255,255,.08);
            border:1px solid rgba(255,255,255,.1);
        }

        .section-padding{
            padding:80px 0;
        }
    </style>
</head>

<body class="bg-slate-950 text-white">

    {% include 'components/public/navbar.html' %}

    {% block content %}
    {% endblock %}

    {% include 'components/public/footer.html' %}

    <script src="{{ url_for('static', filename='js/public/navbar.js') }}"></script>

</body>
</html>
