<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Analisis Sentimen</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                S
            </div>

            <h1 class="text-3xl font-bold text-slate-800">
                Login
            </h1>

            <p class="text-slate-500 mt-2 text-sm">
                Sistem Analisis Sentimen Aplikasi Edlink
            </p>

        </div>

        <!-- Pesan Error -->
        {% if error %}
        <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Form Login -->
        <form method="POST" class="space-y-5">

            <!-- Email -->
            <div>

                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Email
                </label>

                <input
                    type="text"
                    name="email"
                    id="email"
                    placeholder="Masukkan email"
                    required
                    oninvalid="this.setCustomValidity('Masukkan email yang valid')"
                    oninput="this.setCustomValidity('')"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >

            </div>

            <!-- Password -->
            <div>

                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Password
                </label>

                <div class="relative">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                        class="w-full px-4 py-3 pr-14 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                    >

                    <!-- Toggle Password -->
                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute right-4 top-1/2 -translate-y-1/2 opacity-60 hover:opacity-100 transition"
                    >

                        <!-- Eye Icon -->
                        <svg
                            id="eyeIcon"
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-6 h-6 text-slate-500"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                            />

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5
                                c4.477 0 8.268 2.943 9.542 7
                                -1.274 4.057-5.065 7-9.542 7
                                -4.477 0-8.268-2.943-9.542-7z"
                            />

                        </svg>

                    </button>

                </div>

            </div>

            <!-- Forgot Password -->
            <div class="text-right">

                <a
                    href="/forgot-password"
                    class="text-sm text-blue-600 hover:text-blue-700 font-medium"
                >
                    Lupa Password?
                </a>

            </div>

            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-md hover:shadow-lg"
            >
                Login
            </button>

        </form>

        <!-- Register -->
        <div class="text-center mt-6">

            <p class="text-sm text-slate-600">
                Belum punya akun?

                <a
                    href="/register"
                    class="text-blue-600 hover:text-blue-700 font-semibold"
                >
                    Daftar disini
                </a>

            </p>

        </div>

    </div>

    <!-- SCRIPT -->
    <script>

        // VALIDASI EMAIL
        const emailInput = document.getElementById("email");

        emailInput.addEventListener("invalid", function () {

            if (emailInput.validity.valueMissing) {

                emailInput.setCustomValidity(
                    "Email wajib diisi"
                );

            } else if (!emailInput.value.includes("@")) {

                emailInput.setCustomValidity(
                    "Format email harus menggunakan tanda @"
                );

            } else {

                emailInput.setCustomValidity(
                    "Masukkan format email yang valid"
                );

            }

        });

        emailInput.addEventListener("input", function () {
            emailInput.setCustomValidity("");
        });


        // TOGGLE PASSWORD
        const togglePassword = document.getElementById("togglePassword");

        const password = document.getElementById("password");

        const eyeIcon = document.getElementById("eyeIcon");


        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                eyeIcon.innerHTML = `
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M13.875 18.825A10.05 10.05 0 0112 19
                        c-4.478 0-8.268-2.943-9.543-7
                        a9.97 9.97 0 012.152-3.592M6.223 6.223
                        A9.953 9.953 0 0112 5c4.478 0 8.268 2.943
                        9.543 7a9.97 9.97 0 01-4.293 5.774M15 12
                        a3 3 0 11-6 0 3 3 0 016 0zm6 6L3 3"
                    />
                `;

            } else {

                password.type = "password";

                eyeIcon.innerHTML = `
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5
                        c4.477 0 8.268 2.943 9.542 7
                        -1.274 4.057-5.065 7-9.542 7
                        -4.477 0-8.268-2.943-9.542-7z"
                    />
                `;

            }

        });

    </script>

</body>
</html>
