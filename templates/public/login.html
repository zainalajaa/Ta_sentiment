<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-6 rounded-xl shadow w-80">

    <h2 class="text-xl font-bold mb-4 text-center">Login</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" class="w-full border p-2 mb-3 rounded">
        <input type="password" name="password" placeholder="Password" class="w-full border p-2 mb-3 rounded">

        <button class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
            Login
        </button>
    </form>

    {% if error %}
        <p class="text-red-500 mt-3 text-center">{{ error }}</p>
    {% endif %}

</div>

</body>
</html>
