<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - Sistem Analisis Sentimen</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                S
            </div>

            <h1 class="text-3xl font-bold text-slate-800">
                Daftar
            </h1>

            <p class="text-slate-500 mt-2 text-sm">
                Sistem Analisis Sentimen Aplikasi Edlink
            </p>

        </div>

        <!-- Pesan Error -->
        {% if error %}
        <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Pesan Sukses -->
        {% if success %}
        <div class="bg-green-100 border border-green-300 text-green-700 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ success }}
        </div>
        {% endif %}

        <!-- Form Register -->
        <form action="/register" method="POST" class="space-y-5">

            <!-- Username -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Masukkan username"
                    required
                    oninvalid="this.setCustomValidity('Username wajib diisi')"
                    oninput="this.setCustomValidity('')"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >
            </div>

            <!-- Email -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                    oninvalid="this.setCustomValidity('Masukkan email yang valid')"
                    oninput="this.setCustomValidity('')"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Kata Sandi
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Masukkan kata sandi"
                    required
                    minlength="6"
                    oninvalid="this.setCustomValidity('Kata sandi minimal 6 karakter')"
                    oninput="this.setCustomValidity('')"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >
            </div>

            <!-- Tombol Register -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-md hover:shadow-lg"
            >
                Daftar Sekarang
            </button>

        </form>

        <!-- Login -->
        <div class="text-center mt-6">
            <p class="text-sm text-slate-600">
                Sudah memiliki akun?
                <a
                    href="/login"
                    class="text-blue-600 hover:text-blue-700 font-semibold"
                >
                    Masuk disini
                </a>
            </p>
        </div>

    </div>

</body>
</html>
