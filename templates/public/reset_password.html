<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
        }
    </style>

</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-slate-800">
                Reset Password
            </h1>

            <p class="text-slate-500 mt-2 text-sm">
                Masukkan password baru Anda
            </p>

        </div>

        <!-- Error -->
        {% if error %}
        <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}

        {% if invalid %}

        <div class="text-center">
            <a
                href="/forgot-password"
                class="inline-block w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-md"
            >
                Ajukan Ulang
            </a>
        </div>

        {% else %}

        <!-- Form -->
        <form method="POST" class="space-y-5">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Password Baru
                </label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Masukkan password baru"
                    required
                    minlength="6"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Konfirmasi Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Ulangi password baru"
                    required
                    minlength="6"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-md hover:shadow-lg"
            >
                Simpan Password Baru
            </button>

        </form>

        {% endif %}

        <div class="text-center mt-6">
            <a
                href="/login"
                class="text-blue-600 hover:text-blue-700 font-semibold text-sm"
            >
                Kembali ke Login
            </a>
        </div>

    </div>

</body>
</html>
