{% extends 'layouts/public_base.html' %}

{% block title %}
Lupa Password - Sistem Analisis Sentimen
{% endblock %}

{% block content %}
<section class="hero-bg min-h-screen flex items-center justify-center px-4 pt-20 pb-12">

    <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl">

        <!-- Header -->
        <div class="text-center mb-8">

            <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                ?
            </div>

            <h1 class="text-3xl font-bold text-white">
                Lupa Password
            </h1>

            <p class="text-slate-400 mt-2 text-sm">
                Masukkan email akun Anda
            </p>

        </div>

        <!-- Pesan Error -->
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Pesan Sukses -->
        {% if success %}
        <div class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ success }}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" class="space-y-5">

            <div>

                <label class="block text-sm font-medium text-slate-300 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition"
                >

            </div>

            <button
                type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-lg shadow-emerald-500/20"
            >
                Kirim Link Reset
            </button>

        </form>

        <div class="text-center mt-6">

            <a
                href="/login"
                class="text-emerald-400 hover:text-emerald-300 font-semibold text-sm"
            >
                Kembali ke Login
            </a>

        </div>

    </div>

</section>
{% endblock %}
