<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
        }
    </style>

</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <!-- Header -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-slate-800">
                Lupa Password
            </h1>

            <p class="text-slate-500 mt-2 text-sm">
                Masukkan email akun Anda
            </p>

        </div>

        <!-- Error -->
        {% if error %}
        <div class="bg-red-100 border border-red-300 text-red-700 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <!-- Success -->
        {% if success %}
        <div class="bg-green-100 border border-green-300 text-green-700 px-4 py-3 rounded-xl mb-5 text-sm">
            {{ success }}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" class="space-y-5">

            <div>

                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Masukkan email"
                    required
                    oninvalid="this.setCustomValidity('Masukkan email yang valid')"
                    oninput="this.setCustomValidity('')"
                    class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                >

            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-md hover:shadow-lg"
            >
                Kirim
            </button>

        </form>

        <div class="text-center mt-6">

            <a
                href="/login"
                class="text-blue-600 hover:text-blue-700 font-semibold text-sm"
            >
                Kembali ke Login
            </a>

        </div>

    </div>

</body>
</html>
