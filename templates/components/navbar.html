<!-- NAVBAR -->
<header
    class="bg-white shadow-sm border border-gray-300
           px-6 py-4 mb-6 flex items-center justify-between">

    <!-- LEFT -->
    <div class="flex items-center gap-4">

        <!-- TOGGLE -->
        <button id="toggleBtn"
                onclick="toggleSidebar()"
                class="w-11 h-11 rounded-xl bg-gray-100 hover:bg-gray-200
                       flex items-center justify-center transition">

            <i class="fa-solid fa-bars text-gray-700"></i>

        </button>

        <!-- TITLE -->
        <div>

            <h2 class="text-xl font-bold text-gray-800">
                Sistem Analisis Sentimen
            </h2>

            <p class="text-sm text-gray-500">
                Implementasi Algoritma Naïve Bayes Classifier
            </p>

        </div>

    </div>

    <!-- RIGHT -->
    <div class="relative">

        <button id="profileBtn"
                class="flex items-center gap-3 hover:bg-gray-100
                       px-3 py-2 rounded-xl transition">

            <div class="text-right hidden sm:block">

                <p class="font-semibold text-gray-800">
                    {{ session.get('username', 'Admin') }}
                </p>

                <p class="text-sm text-gray-500">
                    Administrator
                </p>

            </div>

            <div class="w-11 h-11 rounded-full bg-emerald-500
                        flex items-center justify-center
                        text-white font-bold shadow-md">

                {{ session.get('username', 'A')[0]|upper }}

            </div>

        </button>

        <!-- MENU -->
        <div id="profileMenu"
             class="hidden absolute right-0 top-full mt-3
                    w-52 bg-white rounded-2xl shadow-xl
                    border border-gray-100 overflow-hidden z-50">

            <a href="{{ url_for('profile') }}"
               class="flex items-center gap-3 px-4 py-3
                      hover:bg-emerald-50 transition">

                <i class="fa-regular fa-user text-emerald-600"></i>
                <span>Lihat Profil</span>

            </a>

            <div class="border-t border-gray-100"></div>

            <a href="{{ url_for('logout') }}"
               class="flex items-center gap-3 px-4 py-3
                      hover:bg-red-50 text-red-600 transition">

                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>

            </a>

        </div>

    </div>

</header>
